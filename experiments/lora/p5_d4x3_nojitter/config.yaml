# Dataset arm D — D4 orientation diversity with the colour jitter removed.
#
# The 3-arm ablation (2026-08-16) showed the two augmentation defects are separable:
#   C  resample + jitter    kid 1.273  cover 0.340  recon_ratio 0.444   composite 0.954
#   A  no augmentation      kid 0.739  cover 0.472  recon_ratio 0.448   composite 1.123
#   B3 D4 lossless + jitter kid 1.243  cover 0.372  recon_ratio 0.653   composite 0.935
#
# Removing the resampling recovered recon_ratio (0.444 -> 0.653) but barely moved kid; removing
# everything took the distributional metrics outright. So the 0.7-1.3 brightness/contrast jitter
# is what pushes generated colour statistics off the real distribution, and the resampling is
# what oversmooths. This arm drops the jitter and keeps the orientation.
#
# The question it settles: A has the best coverage despite the fewest images, which looked like
# "orientation diversity does not help" — but the only orientation arm carried the jitter that
# independently suppresses coverage. If this beats A's 0.472 coverage and 1.123 composite, the
# next study should train on it; otherwise A wins and offline augmentation is dropped entirely.
#
# Identical to p5_d4x3/config.yaml except experiment_name and dataset_version.
experiment_name: p5_d4x3_nojitter
model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  model_family: sd15
  resolution: 512
network:
  network_module: networks.lora
  network_dim: 256
  network_alpha: 128
training:
  train_batch_size: 1
  gradient_accumulation_steps: 15
  max_train_steps: 2000
  learning_rate: 1.0e-5
  unet_lr: 1.0e-5
  text_encoder_lr: 5.0e-5
  lr_scheduler: cosine
  optimizer_type: AdamW8bit
  mixed_precision: fp16
  enable_bucket: true
  gradient_checkpointing: false
  cache_latents: true
  cache_latents_to_disk: true
  noise_offset: 0.05
  min_snr_gamma: 5.0
  ip_noise_gamma: 0.1
data:
  train_data_dir: img
  dataset_version: per_phase_d4x3_nojitter
