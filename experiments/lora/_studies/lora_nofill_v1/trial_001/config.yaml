experiment_name: trial_001
model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  model_family: sd15
  resolution: 512
network:
  network_module: networks.lora
  network_dim: 256
  network_alpha: 128.0
training:
  train_batch_size: 1
  gradient_accumulation_steps: 15
  max_train_steps: 2000
  learning_rate: 1.0e-05
  unet_lr: 1.0e-05
  text_encoder_lr: 5.0e-05
  lr_scheduler: cosine
  optimizer_type: AdamW8bit
  mixed_precision: fp16
  enable_bucket: true
  gradient_checkpointing: false
  cache_latents: true
  cache_latents_to_disk: true
  caption_dropout_rate: 0.2852142919229748
  min_snr_gamma: 5.0
  ip_noise_gamma: 0.1
data:
  train_data_dir: img
  dataset_version: per_phase_noaug
