experiment_name: vae256_typecue

model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  model_family: sd15
  resolution: 256
  # Fine-tuned 256px VAE (diffusers AutoencoderKL folder). Passed to kohya --vae so the
  # diffusion is trained on this VAE's latents, and reused at generation time.
  vae: experiments/sd_vae_finetune/vae_256/weights

network:
  network_module: networks.lora
  network_dim: 32
  network_alpha: 16

training:
  train_batch_size: 16
  gradient_accumulation_steps: 1
  max_train_steps: 10000
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  optimizer_type: AdamW8bit
  mixed_precision: fp16
  enable_bucket: true
  gradient_checkpointing: false
  cache_latents: true
  cache_latents_to_disk: true
  noise_offset: 0.05
  min_snr_gamma: 5.0

data:
  train_data_dir: img
  dataset_version: typecue

sampling:
  enabled: true
  every_n_epochs: 1
  sampler: euler_a
  at_first: true
  prompts:
    - micrograph of allium cepa root tip mitotic cell in prophase phase and type annotated --w 256 --h 256 --s 25
    - micrograph of allium cepa root tip mitotic cell in metaphase phase and type web --w 256 --h 256 --s 25
    - micrograph of allium cepa root tip mitotic cell in anaphase phase and type numbered --w 256 --h 256 --s 25
    - micrograph of allium cepa root tip mitotic cell in telophase phase and type scraped --w 256 --h 256 --s 25
