experiment_name: vqgan_baseline

model:
  resolution: 128
  vae_loss: l2
  timm_model_backend: vgg19
  timm_model_layers: head
  timm_model_offset: 0
  center_crop: false
  random_flip: false

training:
  train_batch_size: 16
  num_train_epochs: 99
  max_train_steps: 50000
  gradient_accumulation_steps: 1
  learning_rate: 4.5e-6
  discr_learning_rate: 1.0e-4
  lr_scheduler: cosine
  discr_lr_scheduler: cosine
  lr_warmup_steps: 500
  seed: 42
  mixed_precision: "no"
  gradient_checkpointing: true
  enable_xformers: false
  use_ema: true
  use_8bit_adam: false
  allow_tf32: false
  validation_steps: 500
  checkpointing_steps: 2500
  log_steps: 50
  log_grad_norm_steps: 500
  report_to: tensorboard
  dataloader_num_workers: 0
  scale_lr: false

validation:
  images:
    - val/tagged/anaphase/004_00096_28.png
    - val/tagged/metaphase/004_00109_6.png
    - val/tagged/prophase/002_00009_35.png
    - val/tagged/telophase/004_00038_51.png

data:
  dataset_dir: datasets/crops/vae/train
  image_column: image
