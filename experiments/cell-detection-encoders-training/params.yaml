general:
  seed: 42
  gpus_list: 0
  device: cuda
  output: ./outputs
clustering:
  input_shape: "128,128,3"
  cluster_num: 15
  method: agglomerative
  encoding_model: VGG16
  batch_size: 256
encoder:
  input_shape: "128,128,1"
  batch_size: 300
  val_split: 0.2
  kernel_size: "4,4"
  filter_size: 32
  epochs: 100
  loss_SSIN_weight: 0.17
  loss_MAE_weight: 0.83
