stages:
  clustering_train:
    cmd: python ./clustering_train.py --seed ${general.seed} --input_shape 
      ${clustering.input_shape} --cluster_num ${clustering.cluster_num} --method
      ${clustering.method} --encoding_model ${clustering.encoding_model} 
      --batch_size ${clustering.batch_size} --output ${general.output}
    params:
    - general.seed
    - general.output
    - clustering.input_shape
    - clustering.cluster_num
    - clustering.method
    - clustering.encoding_model
    - clustering.batch_size
    deps:
    - ./clustering_train.py
    outs:
    - ./outputs/clustering.pkl
  encoder_train:
    cmd: python ./encoder_train.py --seed ${general.seed} --input_shape 
      ${encoder.input_shape} --batch_size ${encoder.batch_size} --val_split 
      ${encoder.val_split} --kernel_size ${encoder.kernel_size} --filter_size 
      ${encoder.filter_size} --epochs ${encoder.epochs} --output 
      ${general.output} --loss_SSIN_weight ${encoder.loss_SSIN_weight} 
      --loss_MAE_weight ${encoder.loss_MAE_weight}
    params:
    - general.seed
    - general.output
    - encoder.input_shape
    - encoder.batch_size
    - encoder.kernel_size
    - encoder.filter_size
    - encoder.val_split
    - encoder.epochs
    - encoder.loss_SSIN_weight
    - encoder.loss_MAE_weight
    deps:
    - ./encoder_train.py
    outs:
    - ./outputs/encoder.keras
plots:
- dvclive/plots/metrics:
    x: step
- dvclive/plots/images
metrics:
- dvclive/metrics.json
