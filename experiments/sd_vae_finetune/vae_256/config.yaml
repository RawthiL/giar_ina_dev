experiment_name: sd_vae_256

model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  subfolder: vae
  resolution: 256
  decoder_only: true
  freeze_quant_conv: false
  weight_l2: 0.2
  weight_kl: 0.000001 #0.001
  weight_lpips: 0.002
  lora:
    enabled: false
    r: 8
    alpha: 8.0
    target_modules: ["conv", "Conv2d", "Linear"]
    dropout: 0.0
    merge_and_save_full: true

training:
  epochs: 20
  lr: 1.0e-4
  batch_size: 8
  mixed_precision: false
  early_stopping_patience: 4
  dataloader_num_workers: 4
  lr_scheduler:
    factor: 0.2
    patience: 7
    min_lr: 1.0e-6
  tensorboard: true
  log_every_n_steps: 50
  log_images_every_n_steps: 50
  eval_batch_size: 8
  random_sample_batch_size: 8

validation:
  images:
    - val/tagged/anaphase/004_00096_28.png
    - val/tagged/metaphase/004_00109_6.png
    - val/tagged/prophase/002_00009_35.png
    - val/tagged/telophase/004_00038_51.png

data:
  vae_crops_dir: datasets/crops/vae
  sources: [tagged, untagged]
  seed: 42
  balanced_sampling: true
  untagged_prob: 0.25
  balanced_epoch_multiplier: 5
  # RGB-preserving online augmentation (mirrors augment_vae_crops.py but keeps all
  # 3 color channels, since SD1.5 is not grayscale). Rotation corners are filled by
  # reflection (mirrored edge), so no constant-value letterbox is learned.
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.5
    rotation_degrees: 5.0
    brightness: 0.3
    contrast: 0.3
