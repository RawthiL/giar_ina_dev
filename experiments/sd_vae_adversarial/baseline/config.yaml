experiment_name: sdvae_adv_baseline

model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  subfolder: vae
  resolution: 512
  freeze_quant_conv: true
  lora:
    enabled: false
    r: 8
    alpha: 8.0
    target_modules: ["conv", "Conv2d", "Linear"]
    dropout: 0.0
    merge_and_save_full: true

training:
  epochs: 2
  lr: 1.0e-4
  batch_size: 2
  mixed_precision: false
  tensorboard: true
  log_every_n_steps: 50
  log_images_every_n_steps: 50
  log_images_n_latents: 4

data:
  vae_crops_dir: datasets/crops/vae
  sources: [tagged, untagged]
  seed: 42
  balanced_sampling: true
  untagged_prob: 0.5
  balanced_epoch_multiplier: 5

adversarial:
  lambda_adv: 1.0
  recon_steps_per_disc_update: 1
  grad_accum_steps: 2
  lambda_ramp_steps: 1000
  use_recon_mse: true
  use_recon_lpips: true
  latent_dataset: datasets/latents/diffuser_latents.parquet

discriminator:
  checkpoint: src/allium_cepa_classifier/weights/classifier_calibrated.pt
  trainable: head
  image_size: 260
  downsample:
    mode: bilinear
    antialias: true
  lr: 2.0e-3
  warmup_steps: 1000
