experiment_name: sdvae_adv_baseline

model:
  pretrained_model_name_or_path: stable-diffusion-v1-5/stable-diffusion-v1-5
  subfolder: vae
  resolution: 512
  decoder_only: true
  freeze_quant_conv: true
  lora:
    enabled: false
    r: 8
    alpha: 8.0
    target_modules: ["conv", "Conv2d", "Linear"]
    dropout: 0.0
    merge_and_save_full: true

training:
  epochs: 10
  lr: 1.0e-4
  batch_size: 2
  mixed_precision: false
  early_stopping_patience: 4
  lr_scheduler:
    factor: 0.2
    patience: 3
    min_lr: 1.0e-6
  tensorboard: true
  log_every_n_steps: 50
  log_images_every_n_steps: 50
  log_images_n_latents: 4
  dataloader_num_workers: 4
  eval_batch_size: 8

data:
  vae_crops_dir: datasets/crops/vae
  sources: [tagged, untagged]
  seed: 42
  balanced_sampling: true
  untagged_prob: 0.25
  balanced_epoch_multiplier: 5

# Recon terms anchor the shared decoder; the GAN term supplies the sharpness the soft
# 200px->512 upscale recon targets cannot teach. Keep the anchor strong enough that val
# LPIPS improves without the decoder walking off the frozen encoder's manifold.
adversarial:
  lambda_adv: 0.1
  recon_steps_per_disc_update: 1
  grad_accum_steps: 4
  lambda_ramp_steps: 500
  use_recon_l1: true
  use_recon_lpips: true
  weight_l1: 2.0
  weight_lpips: 0.02
  grad_clip_norm: 5.0
  # Equal 512->200->512 round trip on BOTH discriminator inputs. Real crops are natively
  # 200px upscaled (soft) while latents decode with genuine 512 detail, so without this the
  # discriminator separates on sharpness, a cue the decoder cannot answer.
  degrade_roundtrip_mid: 200
  latent_dataset: datasets/latents/diffuser_latents.parquet

discriminator:
  checkpoint: src/allium_cepa_classifier/weights/classifier_calibrated.pt
  arch: efficientnet_b2
  trainable: all
  image_size: 260
  downsample:
    mode: bilinear
    antialias: true
  lr: 1.0e-4
  backbone_lr: 1.0e-5
  label_smoothing: 0.1
  freeze_norm_stats: true
  warmup_steps: 500
