[project]
name = "allium-cepa-automation"
version = "0.1.0"
description = "Computer vision pipeline for allium cepa cell detection and mitosis classification"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "==3.12.*"
dependencies = [
    # Deep learning
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=1.0.0",
    # Detection
    "ultralytics>=8.3.0",
    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Image processing
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    # Config & serialization
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    # HuggingFace
    "huggingface-hub>=0.23.0",
    "pyarrow>=23.0.1",
    "fastparquet>=2026.3.0",
]

[dependency-groups]
ui = [
    "streamlit>=1.35.0",
]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allium_cepa_classifier", "src/ui"]

# --- PyTorch CUDA backend (prevents uv from installing CPU-only wheels) ---
[tool.uv]
torch-backend = "cu123"

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
