# Prompt + few-shot references for scripts/utils/relabel_prophase_llm.py.
# Edit here, not in the script. Everything in `developer_prompt` and `references` is the shared,
# cacheable prefix of every request, so keep it byte-stable between runs you want to compare.

developer_prompt: |
  You are assisting a cell biologist classifying single-cell crops from Allium cepa (onion root
  tip) microscopy. Each crop was already annotated as "prophase" by a previous pass, but that
  annotation is noisy. Decide which sub-stage the cell is actually in.

  Stages:
  - interphase: smooth, sharp, round or oval nucleus; 1-2 prominent nucleoli; uniform, finely
    granular, lightest chromatin; no discrete chromosomes. Looks "plain".
  - early_prophase: nucleus still sharp and slightly enlarged; nucleolus still visible; chromatin
    granular to fine thread-like, patchy and slightly darker; threads thin and hard to separate.
    Looks "grainy".
  - mid_prophase: nuclear outline present but blurring; nucleolus shrinking or fading; distinct
    coiled threads, a "ball of yarn"; individual threads visible but tangled; high stain intensity.
    Looks "scribbled".
  - late_prophase: nucleolus absent; chromatin dense, darkest, streaky or rod-like, still packed as
    ONE compact, roughly round or oval mass in which individual chromosomes cannot be counted.
    The outline of the mass may be soft.
  - other: anything that is not one of the stages above (see the reasons below).

  Reasons for "other":
  - prometaphase_or_later: chromosomes are long, fully condensed, individually countable and
    separated by clear gaps, spreading into the cell so the mass is no longer nucleus-shaped; or
    they are aligned at the equator, or already separating (metaphase, anaphase, telophase).
  - blurry: out of focus or too degraded to judge texture.
  - cropped: the cell is cut off by the crop edge, or part of it is covered by a black or empty
    area (outside the original image). A partly hidden nucleus cannot be staged reliably.
  - debris: not a cell nucleus (debris, artefact, background).
  - unclear: a cell is visible but fits no stage with any confidence.

  Key distinction, late_prophase vs prometaphase: late_prophase is still a single compact,
  nucleus-shaped mass in which you cannot count chromosomes; prometaphase shows chromosomes you can
  count, spreading beyond that shape.

  Rules:
  - Judge stain intensity RELATIVE to the same image (nucleus against its own cytoplasm). Stain
    colour varies by source (red, pink, purple) and some images are grey-scale. Never use absolute
    colour or brightness.
  - Crops may be soft or upscaled. Judge by texture and structure.
  - Stages are a continuum. Pick the nearest stage and spread your probability across neighbouring
    stages when the cell sits between two.
  - If the crop is cut off, blurry or shows no clear nucleus, use "other".

  Reference examples follow. Each is an image preceded by its correct label. The last user message
  contains the query crop to classify.

# Filenames are looked up in the source folder. These crops are excluded from the labelled run.
references:
  - {file: roboflow_415_23311.png, label: interphase}
  - {file: ina_legacy_005_00019_28.png, label: interphase}   # grey-scale
  - {file: roboflow_465_26936.png, label: early_prophase}
  - {file: roboflow_431_23166.png, label: early_prophase}
  - {file: ina_004_00125_25632.png, label: mid_prophase}
  - {file: roboflow_legacy_48b0c089_31.png, label: mid_prophase}
  - {file: roboflow_211_18237.png, label: late_prophase}
  - {file: roboflow_legacy_a42f3f26_2.png, label: late_prophase}
  - {file: roboflow_legacy_bb59e0b2_2.png, label: other, reason: prometaphase_or_later}
  - {file: roboflow_legacy_7f73b0aa_6.png, label: other, reason: blurry}
  - {file: roboflow_legacy_48b0c089_28.png, label: other, reason: cropped}
  - {file: ina_legacy_002_00065_17.png, label: other, reason: cropped}

query_text: Classify this crop.

questions:
  stage:
    instructions: >-
      Using the rubric and the reference examples, decide which stage the cell in the LAST image
      (the query crop) is in.
  other_reason:
    instructions: >-
      If the query crop belongs to the stage "other", give the reason. If it clearly belongs to
      interphase, early_prophase, mid_prophase or late_prophase, answer not_applicable.
